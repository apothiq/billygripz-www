<section id="services" class="section-cards">
  <h2>{{ .Site.Params.cardsTitle | default "What We Offer" }}</h2>
  <div class="cards-grid">
    {{ with (hugo.Data).site }}
    {{ range .cards }}
    <div class="card">
      <div class="icon">{{ .icon | default "◆" }}</div>
      <h3>{{ .title }}</h3>
      <p>{{ .description }}</p>
    </div>
    {{ end }}
    {{ end }}
  </div>
</section>
